<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Banking - Dashboard de Compliance</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #58a6ff;
            border-bottom: 1px solid #21262d;
            padding-bottom: 10px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: #8b949e;
            font-size: 14px;
            text-transform: uppercase;
        }
        .card .valor {
            font-size: 28px;
            font-weight: bold;
            color: #f0f6fc;
        }
        .table-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #30363d;
        }
        th {
            color: #8b949e;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-baixo { background-color: rgba(56, 139, 60, 0.15); color: #3fb950; }
        .badge-medio { background-color: rgba(210, 153, 34, 0.15); color: #d29922; }
        .badge-alto { background-color: rgba(248, 81, 73, 0.15); color: #f85149; }
    </style>
</head>
<body>

<div class="container">
    <h1>=== CORE BANKING: MONITOR DE COMPLIANCE ===</h1>
    
    <!-- GRID DE INDICADORES ANALÍTICOS -->
    <div class="dashboard-grid">
        <div class="card">
            <h3>Total Transações</h3>
            <div class="valor" id="totalTransacoes">0</div>
        </div>
        <div class="card">
            <h3>Volume Financeiro</h3>
            <div class="valor" id="volumeTotal">R$ 0,00</div>
        </div>
        <div class="card">
            <h3>Volumetria Expurgada</h3>
            <div class="valor" id="totalExpurgados" style="color: #f85149;">0</div>
        </div>
    </div>

    <!-- TABELA DE TRANSAÇÕES PROCESSADAS -->
    <div class="table-container">
        <h3>Transações Recentes na Esteira</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Valor</th>
                    <th>Classificação de Risco</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <!-- Inserido dinamicamente via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    async function carregarDashboard() {
        try {
            // Consome a API nativa que configuramos na porta 8080 do Java
            const resposta = await fetch('http://localhost:8080/api/transacoes');
            const dados = await respuesta.json();

            // Atualiza os cards estáticos com os valores reais da API
            document.getElementById('totalExpurgados').innerText = dados.expurgados;
            document.getElementById('totalTransacoes').innerText = dados.transacoes.length;

            let volumeTotal = 0;
            const tabelaCorpo = document.getElementById('tabelaCorpo');
            tabelaCorpo.innerHTML = ''; // Limpa a tabela para reconstruir

            // Varre o array de transações injetando as linhas e calculando o volume
            dados.transacoes.forEach(t => {
                volumeTotal += t.valor;

                // Define a classe CSS correta da tag baseado no risco retornado pelo Java
                let badgeClass = 'badge-baixo';
                if (t.risco.includes('MÉDIO')) badgeClass = 'badge-medio';
                if (t.risco.includes('ALTO')) badgeClass = 'badge-alto';

                const linha = `
                    <tr>
                        <td>${t.id}</td>
                        <td>${t.tipo}</td>
                        <td>R$ ${t.valor.toFixed(2).replace('.', ',')}</td>
                        <td><span class="badge ${badgeClass}">${t.risco}</span></td>
                    </tr>
                `;
                tabelaCorpo.innerHTML += linha;
            });

            // Atualiza o card de volume financeiro formatado
            document.getElementById('volumeTotal').innerText = `R$ ${volumeTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;

        } catch (erro) {
            console.error("Aguardando inicialização do servidor Java local...", erro);
        }
    }

    // Carrega os dados na inicialização da página
    carregarDashboard();
    
    // Atualiza automaticamente a cada 5 segundos para simular tempo real
    setInterval(carregarDashboard, 5000);
</script>
</body>
</html>
